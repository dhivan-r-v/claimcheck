name: Container image

# Builds the app image and publishes it to GitHub Container Registry,
# where the Nebius Serverless Endpoint pulls it from.
on:
  push:
    branches: [main]
  pull_request:
    paths: [Dockerfile, .dockerignore, requirements.txt, .github/workflows/image.yml]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (PRs)
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name app -p 8000:8000 ${{ env.IMAGE }}:latest
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && exit 0; sleep 1; done
          docker logs app; exit 1
