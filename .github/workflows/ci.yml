name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # Scripts the tests don't import (eval runner, CLI tools) must at least compile.
      - run: python -m compileall -q claimcheck eval scripts tests
      - run: python -m pytest -q
